name: update-data
on:
  schedule:
    - cron: "30 7 * * 1-5"   # 한국 장 마감 후 (16:30 KST)
    - cron: "30 22 * * 1-5"  # 미국 장 마감 후
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance finance-datareader pandas lxml
      - run: python scan.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "update data" && git push)
